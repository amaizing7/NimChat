name: Finish production upgrade
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source upgrades
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/nimchat/app/NimChatActivity.kt')
          s = p.read_text()
          s = s.replace('import android.graphics.Color\n', 'import android.graphics.BitmapFactory\nimport android.graphics.Color\n')
          s = s.replace('    private val failedOutgoing = linkedMapOf<String, NCFailedMessage>()\n', '    private val failedOutgoing = linkedMapOf<String, NCFailedMessage>()\n    private val outbox by lazy { NCOutbox(getSharedPreferences("nimchat_outbox", MODE_PRIVATE)) }\n    private var refreshQueued = false\n')
          s = s.replace('failedOutgoing.remove(id)\n                refreshMessages(cid)', 'failedOutgoing.remove(id)\n                outbox.remove(id)\n                refreshMessages(cid)', 1)
          s = s.replace('failedOutgoing[id] = NCFailedMessage(id, cid, me, body, friendly(e))\n                refreshMessages(cid)', 'val failed = NCFailedMessage(id, cid, me, body, friendly(e))\n                failedOutgoing[id] = failed\n                outbox.save(failed)\n                refreshMessages(cid)', 1)
          s = s.replace('failedOutgoing.remove(current.id)\n                refreshMessages(current.conversation_id)', 'failedOutgoing.remove(current.id)\n                outbox.remove(current.id)\n                refreshMessages(current.conversation_id)', 1)
          s = s.replace('failedOutgoing[current.id] = current.copy(error = friendly(e))\n                refreshMessages(current.conversation_id)', 'val updated = current.copy(error = friendly(e))\n                failedOutgoing[current.id] = updated\n                outbox.save(updated)\n                refreshMessages(current.conversation_id)', 1)
          start = s.index('    private fun startChatRealtime(cid: String) {')
          end = s.index('    private suspend fun refreshMessages(cid: String) {', start)
          new = '''    private fun startChatRealtime(cid: String) {\n        rt?.cancel()\n        fallback?.cancel()\n        rt = scope.launch {\n            try {\n                ncSupabase.realtime.connect()\n                val channel = ncSupabase.realtime.channel("chat-$cid")\n                val inserts = channel.postgresChangeFlow<PostgresAction.Insert>(schema = "public") {\n                    table = "messages"\n                    filter = "conversation_id=eq.$cid"\n                }\n                val updates = channel.postgresChangeFlow<PostgresAction.Update>(schema = "public") {\n                    table = "messages"\n                    filter = "conversation_id=eq.$cid"\n                }\n                val deletes = channel.postgresChangeFlow<PostgresAction.Delete>(schema = "public") {\n                    table = "messages"\n                    filter = "conversation_id=eq.$cid"\n                }\n                channel.subscribe()\n                merge(inserts, updates, deletes).collect { queueRefresh(cid) }\n            } catch (_: Exception) {}\n        }\n    }\n\n    private fun queueRefresh(cid: String) {\n        if (refreshQueued) return\n        refreshQueued = true\n        scope.launch {\n            delay(150)\n            refreshQueued = false\n            refreshMessages(cid)\n        }\n    }\n\n'''
          s = s[:start] + new + s[end:]
          s = s.replace('failedOutgoing.values\n                .filter { NimChatRetry.shouldRetry(it, cid) }', 'outbox.loadForConversation(cid).forEach { failedOutgoing[it.id] = it }\n            failedOutgoing.values\n                .filter { NimChatRetry.shouldRetry(it, cid) }', 1)
          s = s.replace('''message.attachment_path?.let {\n            val fileButton''', '''message.attachment_path?.let {\n            if (message.attachment_mime.orEmpty().startsWith("image/")) {\n                val preview = ImageView(this).apply {\n                    adjustViewBounds = true\n                    maxHeight = 520\n                    scaleType = ImageView.ScaleType.CENTER_INSIDE\n                    contentDescription = message.attachment_name ?: "تصویر"\n                }\n                box.addView(preview, lp(-1, 6, 0))\n                scope.launch {\n                    try {\n                        val bytes = withContext(Dispatchers.IO) { ncSupabase.storage.from("chat-files").downloadAuthenticated(it) }\n                        preview.setImageBitmap(BitmapFactory.decodeByteArray(bytes, 0, bytes.size))\n                    } catch (_: Exception) {}\n                }\n            }\n            val fileButton''', 1)
          s = s.replace('rt?.cancel(); fallback?.cancel(); rt = null; fallback = null', 'rt?.cancel(); fallback?.cancel(); rt = null; fallback = null; refreshQueued = false', 1)
          p.write_text(s)
          Path('app/src/main/java/com/nimchat/app/NCOutbox.kt').write_text('''package com.nimchat.app\n\nimport android.content.SharedPreferences\nimport kotlinx.serialization.builtins.ListSerializer\nimport kotlinx.serialization.json.Json\n\nclass NCOutbox(private val prefs: SharedPreferences) {\n    private val json = Json { ignoreUnknownKeys = true }\n    private val key = "pending_failed_messages"\n\n    @Synchronized fun load(): List<NCFailedMessage> = runCatching {\n        val raw = prefs.getString(key, null) ?: return emptyList()\n        json.decodeFromString(ListSerializer(NCFailedMessage.serializer()), raw)\n    }.getOrDefault(emptyList())\n\n    @Synchronized fun loadForConversation(conversationId: String): List<NCFailedMessage> = load().filter { it.conversation_id == conversationId }\n\n    @Synchronized fun save(message: NCFailedMessage) {\n        val next = load().filterNot { it.id == message.id } + message\n        prefs.edit().putString(key, json.encodeToString(ListSerializer(NCFailedMessage.serializer()), next)).apply()\n    }\n\n    @Synchronized fun remove(id: String) {\n        val next = load().filterNot { it.id == id }\n        prefs.edit().putString(key, json.encodeToString(ListSerializer(NCFailedMessage.serializer()), next)).apply()\n    }\n}\n''')
          PY
      - name: Run tests and build after upgrade
        run: gradle test lintDebug assembleDebug --stacktrace
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/nimchat/app/NimChatActivity.kt app/src/main/java/com/nimchat/app/NCOutbox.kt
          git diff --cached --quiet || git commit -m 'feat: harden realtime, persistent retry outbox, image previews'
          git push
      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/finish-production-upgrade.yml
          git commit -m 'chore: remove one-shot upgrade workflow'
          git push

# trigger
