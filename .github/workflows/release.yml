name: Build NimChat Release APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NIMCHAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nimchat-release.jks"

      - name: Run tests, lint, and build signed release APK
        env:
          NIMCHAT_KEYSTORE_PATH: ${{ runner.temp }}/nimchat-release.jks
          NIMCHAT_KEYSTORE_PASSWORD: ${{ secrets.NIMCHAT_KEYSTORE_PASSWORD }}
          NIMCHAT_KEY_ALIAS: ${{ secrets.NIMCHAT_KEY_ALIAS }}
          NIMCHAT_KEY_PASSWORD: ${{ secrets.NIMCHAT_KEY_PASSWORD }}
        run: gradle test lintDebug assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NimChat-release-apk
          path: app/build/outputs/apk/release/app-release.apk
