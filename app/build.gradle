plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.nimchat.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nimchat.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'

        buildConfigField 'String', 'SUPABASE_URL', '"https://hqkreszsbkgptplyzkad.supabase.co"'
        buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_rh746ie553rTov-m4d1B2g_Kp58llQW"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        release {
            def keystorePath = System.getenv('NIMCHAT_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('NIMCHAT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NIMCHAT_KEY_ALIAS')
                keyPassword System.getenv('NIMCHAT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

configurations.configureEach {
    resolutionStrategy.force 'androidx.browser:browser:1.8.0'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:3.8.0'
    implementation 'io.github.jan-tennert.supabase:auth-kt:3.8.0'
    implementation 'io.github.jan-tennert.supabase:realtime-kt:3.8.0'
    implementation 'io.github.jan-tennert.supabase:storage-kt:3.8.0'
    implementation 'io.ktor:ktor-client-android:3.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
}
