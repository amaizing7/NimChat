plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nimchat.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nimchat.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:3.1.4'
    implementation 'io.github.jan-tennert.supabase:auth-kt:3.1.4'
    implementation 'io.github.jan-tennert.supabase:realtime-kt:3.1.4'
    implementation 'io.ktor:ktor-client-android:3.0.3'
}

// Fill these with the Supabase project URL and publishable/anon key before enabling network calls.
buildConfigField 'String', 'SUPABASE_URL', '""'
buildConfigField 'String', 'SUPABASE_KEY', '""'
